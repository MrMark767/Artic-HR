<div class="login-layout">
  <!-- Panel Lateral Izquierdo de Pantalla Completa (Sidebar) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">
        <img src="ArticFoxLogo.png" alt="Artic Fox Logo" class="logo-img" />
      </div>
      <h1 class="portal-brand-title">Portal de HR</h1>
    </div>

    <div class="sidebar-body">
      <p class="sidebar-tagline">Sistema Integral de Gestión de Recursos Humanos</p>
    </div>

    <div class="sidebar-footer">
      <span>Artic-HR</span>
    </div>
  </aside>

  <!-- Área Principal con el Formulario Centrado -->
  <main class="main-area">
    <div class="login-card">
      <div class="form-header">
        <h2 class="form-title">Iniciar Sesión</h2>
        <p class="form-subtitle">Ingresa tus credenciales para acceder al sistema</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        @if (errorMessage()) {
          <div class="error-banner" role="alert">
            <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <div class="form-group">
          <label for="email">Correo electrónico o Usuario</label>
          <input
            type="email"
            id="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            autocomplete="username"
            spellcheck="false"
            required
            enterkeyhint="next"
            placeholder="nombre@empresa.com"
          />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a href="#olvide-contrasena" class="forgot-link" (click)="$event.preventDefault()">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="password-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="password"
              name="password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              autocomplete="current-password"
              required
              enterkeyhint="done"
              placeholder="************"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                </svg>
              } @else {
                <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
              }
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner" aria-hidden="true"></span>
            <span>Iniciando sesión...</span>
          } @else {
            <span>Iniciar Sesión</span>
          }
        </button>
      </form>
    </div>
  </main>
</div>
